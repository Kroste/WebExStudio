name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']        # z. B. v1.0.0 → erzeugt ein GitHub-Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # nötig, damit das Release angelegt werden kann

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # ── 1) Tests ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WebExStudio.slnx

      - name: Build (Release)
        run: dotnet build WebExStudio.slnx -c Release --no-restore

      - name: Tests
        run: dotnet test WebExStudio.slnx -c Release --no-build --verbosity normal

  # ── 2) Release-Build (linux-x64) ───────────────────────────────────────────
  # Läuft NUR bei Tags (v*) oder manuell — nicht bei jedem Push/PR. Das vermeidet, dass
  # bei jedem Commit große Self-Contained-Artefakte hochgeladen werden (Speicherkontingent).
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Version aus Tag/Run ableiten
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (linux-x64)
        run: |
          dotnet publish WebExStudio.UI/WebExStudio.UI.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish/linux-x64

      - name: Paket schnüren
        run: |
          cd publish/linux-x64
          tar -czf "../../WebExStudio-${{ steps.ver.outputs.version }}-linux-x64.tar.gz" .

      - name: Artefakt hochladen (kurze Aufbewahrung, spart Speicher)
        uses: actions/upload-artifact@v4
        with:
          name: WebExStudio-linux-x64
          path: WebExStudio-*-linux-x64.tar.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: GitHub-Release anlegen/aktualisieren (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WebExStudio-*-linux-x64.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
