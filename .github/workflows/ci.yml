name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']        # z. B. v1.0.0 → erzeugt ein GitHub-Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write       # nötig, damit das Release angelegt werden kann

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # JS-Actions auf Node 24 ausführen (behebt die Node-20-Deprecation, ohne Action-Versionen
  # mit potenziell brechenden Major-Sprüngen zu wechseln). Nach dem Node-24-Standard ein No-op.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 1) Tests ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WebExStudio.slnx

      - name: Build (Release)
        run: dotnet build WebExStudio.slnx -c Release --no-restore

      - name: Tests
        run: dotnet test WebExStudio.slnx -c Release --no-build --verbosity normal

  # ── 2) Release-Builds (Linux + Windows) ────────────────────────────────────
  # Läuft NUR bei Tags (v*) oder manuell — nicht bei jedem Push/PR. Das vermeidet, dass
  # bei jedem Commit große Self-Contained-Artefakte hochgeladen werden (Speicherkontingent).
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
          - rid: win-x64
    steps:
      - uses: actions/checkout@v4

      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Version aus Tag/Run ableiten
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GUI (${{ matrix.rid }})
        run: |
          dotnet publish WebExStudio.UI/WebExStudio.UI.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish/${{ matrix.rid }}

      - name: Publish CLI (${{ matrix.rid }})
        run: |
          dotnet publish WebExStudio.Cli/WebExStudio.Cli.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish-cli/${{ matrix.rid }}

      - name: Pakete schnüren (GUI + CLI getrennt)
        run: |
          V="${{ steps.ver.outputs.version }}"
          R="${{ matrix.rid }}"
          if [[ "$R" == win-* ]]; then
            (cd "publish/$R"     && zip -r "../../WebExStudio-$V-$R.zip" .)
            (cd "publish-cli/$R" && zip -r "../../webex-$V-$R.zip" .)
          else
            (cd "publish/$R"     && tar -czf "../../WebExStudio-$V-$R.tar.gz" .)
            (cd "publish-cli/$R" && tar -czf "../../webex-$V-$R.tar.gz" .)
          fi

      - name: AppImage bauen (nur linux-x64)
        if: matrix.rid == 'linux-x64'
        run: bash build/make-appimage.sh publish/linux-x64 "${{ steps.ver.outputs.version }}" .

      # Actions-Artefakt nur bei manuellem Lauf (workflow_dispatch) — bei Tags ist das
      # GitHub-Release die Verteilung (dessen Assets zählen NICHT gegens Artefakt-Kontingent).
      # continue-on-error: ein voller Artefakt-Speicher darf das Release nie blockieren.
      - name: Artefakte hochladen (nur bei manuellem Lauf)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: WebExStudio-${{ matrix.rid }}
          path: |
            WebExStudio-*-${{ matrix.rid }}.zip
            WebExStudio-*-${{ matrix.rid }}.tar.gz
            webex-*-${{ matrix.rid }}.zip
            webex-*-${{ matrix.rid }}.tar.gz
            WebExStudio-*-x86_64.AppImage
          retention-days: 7
          if-no-files-found: ignore

      - name: GitHub-Release anlegen/aktualisieren (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WebExStudio-*-${{ matrix.rid }}.zip
            WebExStudio-*-${{ matrix.rid }}.tar.gz
            webex-*-${{ matrix.rid }}.zip
            webex-*-${{ matrix.rid }}.tar.gz
            WebExStudio-*-x86_64.AppImage
          fail_on_unmatched_files: false
          generate_release_notes: true
