name: CI

# Build + Tests bei jedem Push/PR auf main sowie manuell.
# Der Release-Workflow (release.yml) läuft separat bei Tags v* und dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: .NET einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet-Cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Key hängt an der zentralen Paketliste (CPM): ändert sich die
          # Directory.Packages.props, wird ein neuer Cache aufgebaut.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore WebExStudio.slnx

      - name: Build (Release)
        run: dotnet build WebExStudio.slnx -c Release --no-restore

      - name: Tests
        run: dotnet test WebExStudio.slnx -c Release --no-build --verbosity normal
